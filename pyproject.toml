[project]
name = "vox"
version = "0.1.0"
description = "vox — the voice-interaction seam: wires speech-to-text (via a joe engine) and text-to-speech into a pluggable adapter other repos vendor."
authors = [
    {name = "Peter Kagstrom", email = "peter.kagstrom@gmail.com"},
]
dependencies = [
    "httpx>=0.27.0",
    "pyttsx3>=2.90",
    "typer",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vox = "vox.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `include`, not an explicit list. `packages = ["vox"]` shipped a wheel with
# no `vox/adapters/` in it, because an explicit list is not recursive -- the
# editable install used for development resolves against the source tree and
# hides that completely. joe had the same defect for the same reason. The CI
# step that builds a wheel and reads its manifest is what catches it now, and
# `vox*` means a new subpackage is included without anyone remembering to.
include = ["vox*"]

[tool.pytest.ini_options]
# The walkthrough runs with the tests, per the charter's show-it-by-running-it:
# a worked example nobody executes is prose, and prose drifts.
testpaths = ["tests", "walkthrough"]
