[project]
name = "vox"
version = "0.1.0"
description = "vox — the voice-interaction seam: wires speech-to-text (via a joe engine) and text-to-speech into a pluggable adapter other repos vendor."
authors = [
    {name = "Peter Kagstrom", email = "peter.kagstrom@gmail.com"},
]
dependencies = [
    "httpx>=0.27.0",
    "pyttsx3>=2.90",
    "typer",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vox = "vox.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
