[project]
name = "vox"
version = "0.1.0"
description = "vox — the voice-interaction seam: wires speech-to-text (via a joe engine) and text-to-speech into a pluggable adapter other repos vendor."
authors = [
    {name = "Peter Kagstrom", email = "peter.kagstrom@gmail.com"},
]
dependencies = [
    "httpx>=0.27.0",
    "pyttsx3>=2.90",
    "typer",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vox = "vox.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `include`, not an explicit list: an explicit list is not recursive, and the
# editable install used for development resolves against the source tree, so
# a subpackage left out still imports there. `vox*` takes in a new subpackage
# with no further edit, and `walkthrough/check_wheel.py` reads the built
# wheel's manifest in CI.
include = ["vox*"]

[tool.pytest.ini_options]
# The walkthrough runs with the tests, per the charter's show-it-by-running-it:
# a worked example nobody executes is prose, and prose drifts.
testpaths = ["tests", "walkthrough"]
